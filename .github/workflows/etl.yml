name: Sales ETL Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # Daily at 00:00 UTC (08:00 Philippines time)

permissions:
  contents: read

jobs:
  run-etl:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run data quality tests
        run: pytest -v

      - name: Execute ETL pipeline
        run: python run_etl.py

      - name: Upload ETL outputs
        uses: actions/upload-artifact@v4
        with:
          name: sales-etl-output
          path: outputs/
          if-no-files-found: error
          retention-days: 14
